name: 构建 TP842N-V3 打印服务器固件

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: '启用调试模式'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置构建环境
      run: |
        sudo apt-get update
        sudo apt upgrade
        sudo apt-get install -y \
          build-essential ccache ecj fastjar file g++ gawk \
          gettext git openjdk-11-jdk libelf-dev \
          libncurses5-dev libncursesw5-dev libssl-dev \
          2to3 python2 python-is-python3 python3 unzip wget \
          python3-distutils python3-setuptools python3-dev \
          rsync subversion swig time xsltproc zlib1g-dev \
          libxml-parser-perl libusb-dev libusb-1.0-0-dev \
          gperf flex bison libncurses-dev libreadline-dev \
          libglib2.0-dev libfdt-dev libpixman-1-dev \
          zlib1g-dev libaio-dev libbluetooth-dev libbrlapi-dev \
          libbz2-dev libcap-dev libcap-ng-dev libcurl4-openssl-dev \
          libgtk-3-dev libibverbs-dev libjpeg8-dev liblzo2-dev \
          libncurses5-dev libnuma-dev libnss3-dev libopus-dev \
          libpng-dev librbd-dev libsasl2-dev libsdl1.2-dev \
          libseccomp-dev libsnappy-dev libssh2-1-dev libspice-server-dev \
          libusb-1.0-0-dev libusb-dev libvde-dev libvdeplug-dev \
          libvorbis-dev libxen-dev libxinerama-dev libxml2-dev \
          libxrandr-dev libxrender-dev libxslt1-dev libyajl-dev \
          linux-libc-dev make pkg-config python3-dev python3-pip \
          python3-setuptools python3-wheel uuid-dev xfslibs-dev \
          libasound2-dev libpulse-dev libnss3-dev libxcomposite-dev \
          libxdamage-dev libxrandr-dev libxtst-dev libasound2-dev \
          libpulse-dev libnss3-dev libxcomposite-dev libxdamage-dev \
          libxrandr-dev libxtst-dev libgtk-3-dev libusb-1.0-0-dev \
          libusb-dev libcap-dev libcap-ng-dev libseccomp-dev \
          libpixman-1-dev libglib2.0-dev libfdt-dev libncurses-dev \
          libreadline-dev libaio-dev libbluetooth-dev libbrlapi-dev \
          libbz2-dev libcurl4-openssl-dev libibverbs-dev libjpeg8-dev \
          liblzo2-dev libncurses5-dev libnuma-dev libnss3-dev libopus-dev \
          libpng-dev librbd-dev libsasl2-dev libsdl1.2-dev libsnappy-dev \
          libssh2-1-dev libspice-server-dev libvde-dev libvdeplug-dev \
          libvorbis-dev libxen-dev libxinerama-dev libxml2-dev libxrandr-dev \
          libxrender-dev libxslt1-dev libyajl-dev linux-libc-dev make \
          pkg-config python3-dev python3-pip python3-setuptools python3-wheel \
          uuid-dev xfslibs-dev

    - name: 创建工作目录
      run: |
        mkdir -p $HOME/openwrt-build
        cd $HOME/openwrt-build
        
    - name: 克隆 OpenWrt 源码
      run: |
        cd $HOME/openwrt-build
        git clone https://github.com/lh85558/openwrt.git
        cd openwrt
        git checkout v23.05.3
        
    - name: 更新和安装 feeds
      run: |
        cd $HOME/openwrt-build/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: 复制配置文件
      run: |
        cd $HOME/openwrt-build/openwrt
        cp $GITHUB_WORKSPACE/configs/tp842n3.config .config
        
    - name: 下载额外软件包
      run: |
        cd $HOME/openwrt-build/openwrt
        ./scripts/feeds install cups cups-bjnp luci-i18n-base-zh-cn
        
    - name: 配置编译选项
      run: |
        cd $HOME/openwrt-build/openwrt
        make defconfig
        
    - name: 下载源码包
      run: |
        cd $HOME/openwrt-build/openwrt
        make download -j$(nproc) || true
        
    - name: 编译固件
      run: |
        cd $HOME/openwrt-build/openwrt
        make -j$(nproc) || make -j1 V=s
        
    - name: 检查编译结果
      run: |
        cd $HOME/openwrt-build/openwrt
        ls -la bin/targets/ar71xx/generic/
        
    - name: 复制固件文件
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        cd $HOME/openwrt-build/openwrt
        cp bin/targets/ar71xx/generic/*842n-v3* $GITHUB_WORKSPACE/output/ || true
        ls -la $GITHUB_WORKSPACE/output/
        
    - name: 上传固件到 GitHub Releases
      uses: actions/upload-artifact@v4
      with:
        name: tp842n3-printserver-firmware
        path: output/
        retention-days: 30
        
    - name: 生成发布信息
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cd $GITHUB_WORKSPACE
        echo "## TP842N-V3 打印服务器固件" > release.md
        echo "" >> release.md
        echo "构建时间: $(date '+%Y-%m-%d %H:%M:%S')" >> release.md
        echo "OpenWrt 版本: 23.05.3" >> release.md
        echo "" >> release.md
        echo "### 功能特性" >> release.md
        echo "- ✅ CUPS 中文打印服务" >> release.md
        echo "- ✅ HP LaserJet 1020/1020 plus 驱动" >> release.md
        echo "- ✅ USB 打印机支持" >> release.md
        echo "- ✅ 定时重启功能" >> release.md
        echo "- ✅ 中文界面" >> release.md
        echo "" >> release.md
        echo "### 默认配置" >> release.md
        echo "- LAN IP: 192.168.10.1" >> release.md
        echo "- Web 登录: admin / thdn12345678" >> release.md
        echo "- WiFi SSID: THDN-dayin" >> release.md
        echo "- WiFi 密码: thdn12345678" >> release.md
        echo "- 主机名: THDN-PrintServer" >> release.md
        echo "" >> release.md
        echo "### 固件文件" >> release.md
        ls -la output/ >> release.md

# CUPS 配置文件 - 打印服务器设置
LogLevel warn
PageLogFormat
MaxLogSize 1048576

# 监听所有网络接口
Port 631
Listen /var/run/cups/cups.sock

# Web 界面配置
Browsing On
BrowseLocalProtocols dnssd
BrowseWebIF Yes

# 访问控制
<Location />
  Order allow,deny
  Allow From 192.168.10.0/24
  Allow From 127.0.0.1
</Location>

<Location /admin>
  Order allow,deny
  Allow From 192.168.10.0/24
  Allow From 127.0.0.1
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow From 192.168.10.0/24
  Allow From 127.0.0.1
</Location>

# 打印机配置
DefaultShared Yes
PreserveJobFiles No
AutoPurgeJobs Yes
MaxJobs 500

# 纸张设置
DefaultPaperSize A4
